<!doctype html>
<!-- The sharing image (assets/og.png, 1200 x 630). Drawn by
     python3 tools/update-captures.py --og. Same ribbon, wordmark and headline
     as the homepage band; it shows no app capture, so it never goes stale. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nomentra sharing image</title>
<link rel="stylesheet" href="../style.css">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:var(--hero-base)}
.og{position:absolute;inset:0;padding:64px 80px 72px;display:flex;flex-direction:column;justify-content:space-between}
.og-brand{display:flex;align-items:center;gap:20px;font-family:var(--sans);font-size:44px;font-weight:400;color:var(--hero-ink)}
.og-brand img{width:72px;height:72px;border-radius:16px}
.og h1{color:var(--hero-ink);font-size:64px;line-height:1.08;font-weight:500;letter-spacing:-.02em;max-width:13.5em}
</style>
</head>
<body>
<div class="og ribbon">
  <div class="ribbon-art" aria-hidden="true"><span class="ribbon-ring"></span><span class="ribbon-strip"></span></div>
  <div class="og-brand"><img src="../assets/icon-512.png" alt="">nomentra</div>
  <h1>Your journeys, your achievements, your days that count.</h1>
</div>
</body>
</html>
